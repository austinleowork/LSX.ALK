<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;width:100%;overflow:hidden;background:#000000;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  body{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0}

  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}

  .mark{
    position:absolute;
    font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
    color:rgba(255,255,255,.16);
    user-select:none;pointer-events:none;
    opacity:0;animation:rise 1.6s cubic-bezier(.16,1,.3,1) 1.35s forwards;
    z-index:4;
  }
  .mark.tl{top:26px;left:28px}
  .mark.tr{top:26px;right:28px}

  /* the other two places, so you can move sideways without going home */
  .cities{
    position:absolute;left:0;right:0;
    bottom:max(34px, calc(env(safe-area-inset-bottom) + 6px));
    display:flex;justify-content:center;align-items:center;
    gap:clamp(16px, 5vw, 46px);
    z-index:4;
    opacity:0;animation:rise 1.8s cubic-bezier(.16,1,.3,1) 1.55s forwards;
  }
  .cities a{
    pointer-events:auto;cursor:pointer;text-decoration:none;
    font-size:clamp(9px, 2.6vw, 10.5px);
    letter-spacing:.3em;text-transform:uppercase;text-indent:.3em;
    color:rgba(255,255,255,.20);
    padding:8px 2px;margin:-8px 0;white-space:nowrap;
    transition:color .4s ease, letter-spacing .4s cubic-bezier(.16,1,.3,1);
  }
  .cities a:hover,.cities a:focus-visible{
    color:rgba(255,255,255,.78);letter-spacing:.38em;outline:none;
  }
  .cities .dot{
    width:2px;height:2px;border-radius:50%;flex:none;
    background:rgba(255,255,255,.16);
  }

  #back{
    pointer-events:auto;cursor:pointer;background:none;border:0;padding:6px 8px;
    margin:-6px -8px;font:inherit;letter-spacing:.28em;text-transform:uppercase;
    font-size:9.5px;color:rgba(255,255,255,.16);text-decoration:none;
    transition:color .35s ease;display:inline-block;
  }
  #back:hover,#back:focus-visible{color:rgba(255,255,255,.66);outline:none}
  #back .arrow{opacity:.5;margin-right:.7em;display:inline-block;transition:transform .35s cubic-bezier(.16,1,.3,1)}
  #back:hover .arrow{transform:translateX(-3px)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .ring{
    position:fixed;top:0;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;
    border:1px solid rgba(255,255,255,.34);border-radius:50%;
    pointer-events:none;z-index:5;opacity:0;
    transition:opacity .4s ease, width .25s cubic-bezier(.16,1,.3,1), height .25s cubic-bezier(.16,1,.3,1), margin .25s cubic-bezier(.16,1,.3,1), border-color .25s ease;
    mix-blend-mode:difference;
  }
  .ring.on{opacity:1}
  .ring.down{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-color:rgba(255,255,255,.8)}
  html.fine, html.fine body{cursor:none}
  html.fine #back, html.fine .cities a{cursor:none}
  html.coarse .ring{display:none}

  .hint{
    position:absolute;left:0;right:0;bottom:max(74px, calc(env(safe-area-inset-bottom) + 46px));
    text-align:center;
    font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(255,255,255,.13);
    user-select:none;pointer-events:none;z-index:3;
    opacity:0;animation:rise 1.6s cubic-bezier(.16,1,.3,1) 1.9s forwards;
    transition:opacity .7s ease;text-indent:.3em;
  }
  .hint.gone{opacity:0 !important}

  .fallback{
    position:absolute;inset:0;display:none;place-items:center;
    background:#000000;z-index:1;
  }
  html.nogl .fallback{display:grid}
  html.nogl canvas{display:none}
  .fallback i{
    display:block;width:min(46vmin,320px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(46% 40% at 36% 28%, rgba(255,255,255,.20) 0%, transparent 62%);
  }
</style>

<script>
(function () {
  "use strict";

  var html = document.documentElement;

  /* ================================================================== */
  var YR = 0.12802;                            /* y range the bytes encode */

  var NP = carHome.length/2;

    cv.width = cw; cv.height = ch;

    var d = x.getImageData(0, 0, cw, ch).data;

  ].join("\n");

  var POINT_VS = [
    "attribute vec2 a_p;",
    "attribute float a_s;",
    "uniform vec2 u_res;",
    "uniform float u_size;",
    "varying float v_s;",
    "void main(){",
    "  gl_Position = vec4(a_p.x * (u_res.y/u_res.x), a_p.y, 0.0, 1.0);",
    "  gl_PointSize = u_size * (0.65 + a_s*0.7);",
    "  v_s = a_s;",
    "}"
  ].join("\n");

  var POINT_FS = [PRE,
    "varying float v_s;",
    "uniform float u_intro;",
    "void main(){",
    "  float a = 1.0 - smoothstep(0.08, 0.5, length(gl_PointCoord - 0.5));",
    "  vec3 c = mix(vec3(0.66,0.68,0.72), vec3(1.0,1.0,1.0), v_s);",
    "  gl_FragColor = vec4(c, a*u_intro*0.92);",
    "}"
  ].join("\n");

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s)); return null;
    }
    return s;
  }
  function link(v, f) {
    var vs = compile(gl.VERTEX_SHADER, v), fs = compile(gl.FRAGMENT_SHADER, f);
    if (!vs || !fs) return null;
    var p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
    return p;
  }

  var PROG = link(POINT_VS, POINT_FS);
  if (!PROG) { html.classList.add("nogl"); return; }
  var U = {
    u_res:  gl.getUniformLocation(PROG, "u_res"),
    u_size: gl.getUniformLocation(PROG, "u_size"),
    u_intro:gl.getUniformLocation(PROG, "u_intro")
  };

  var ppos = new Float32Array(NP*2);
  var pseed = new Float32Array(NP);
  var pvx = new Float32Array(NP), pvy = new Float32Array(NP);
  for (var i = 0; i < NP; i++) {
    ppos[i*2] = (Math.random()-0.5)*4.5;
    ppos[i*2+1] = (Math.random()-0.5)*2.6;
    pseed[i] = Math.random();
  }
  var posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, ppos, gl.DYNAMIC_DRAW);
  var seedBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, seedBuf);
  gl.bufferData(gl.ARRAY_BUFFER, pseed, gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(PROG, "a_p");
  var aSeed = gl.getAttribLocation(PROG, "a_s");

  /* ================================================================== */
  var W = 0, H = 0, SW = 2.4;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, fine ? 1.75 : 1.5);
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(1, Math.sqrt(2100000 / (w*dpr * h*dpr)));
    W = Math.max(1, Math.round(w*dpr*s));
    H = Math.max(1, Math.round(h*dpr*s));
    canvas.width = W; canvas.height = H;
    gl.viewport(0, 0, W, H);
    SW = Math.min(1.55, (w/h) * 0.90);      /* how wide the car sits in frame */
  }
  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ setTimeout(resize, 250); });

  /* ================================================================== */
  var ring = document.getElementById("ring");
  var hint = document.getElementById("hint");
  var hintGone = false;
  var ptr = { x: 0, y: 0, has: false };
  var shock = 0, sinceMove = 0;

  function setPointer(cx, cy) {
    var w = window.innerWidth, h = window.innerHeight;
    ptr.x = ((cx*2 - w) / h) * 2.0;
    ptr.y = (-(cy*2 - h) / h) * 2.0;
    ptr.has = true; sinceMove = 0;
    if (!hintGone) { hintGone = true; hint.classList.add("gone"); }
  }
  window.addEventListener("mousemove", function (e) {
    setPointer(e.clientX, e.clientY);
    ring.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
    ring.classList.add("on");
  }, { passive: true });
  window.addEventListener("mouseleave", function () { ptr.has = false; ring.classList.remove("on"); });
  window.addEventListener("mousedown", function () { ring.classList.add("down"); shock = 1.0; sinceMove = 0; });
  window.addEventListener("mouseup",   function () { ring.classList.remove("down"); });
  window.addEventListener("touchstart", function (e) {
    if (e.touches[0]) { setPointer(e.touches[0].clientX, e.touches[0].clientY); shock = 1.0; }
  }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener("touchend", function () { ptr.has = false; }, { passive: true });

  var tilt = { x: 0, y: 0 };
  window.addEventListener("deviceorientation", function (e) {
    if (e.gamma == null || e.beta == null) return;
    tilt.x = Math.max(-1, Math.min(1, e.gamma/32)) * 1.15;
    tilt.y = Math.max(-1, Math.min(1, (e.beta-45)/32)) * -1.15;
  }, true);

  var intro = 0, morph = 0;
  var cur = { x: 0, y: 0 };
  var time = 0, last = performance.now(), running = true;
  document.addEventListener("visibilitychange", function () {
    running = !document.hidden;
    if (running) { last = performance.now(); requestAnimationFrame(frame); }
  });

  function frame(now) {
    if (!running) return;
    var dt = Math.min((now - last)/1000, 0.05);
    last = now; time += dt; sinceMove += dt;
    var k = dt*60;

    intro += (1 - intro) * (1 - Math.pow(0.955, k));
    shock *= Math.pow(0.90, k);

    var tx2, ty2;
    if (ptr.has)               { tx2 = ptr.x; ty2 = ptr.y; }
    else if (tilt.x || tilt.y) { tx2 = tilt.x; ty2 = tilt.y; }
    else {
      tx2 = Math.cos(time*0.31)*1.05 + Math.cos(time*0.13)*0.35;
      ty2 = Math.sin(time*0.24)*0.85 + Math.sin(time*0.17)*0.30;
    }
    cur.x += (tx2 - cur.x) * (1 - Math.pow(0.86, k));
    cur.y += (ty2 - cur.y) * (1 - Math.pow(0.86, k));

    /* leave it alone long enough and the car quietly becomes the line,
       then goes back. the reward for not touching anything. */
    var want = 0;
    if (sinceMove > 6.5) {
      var phase = (sinceMove - 6.5) % 17.0;
      if (phase < 5.5) want = 1;
    }
    morph += (want - morph) * (1 - Math.pow(0.055, dt));

    var sx = SW, sy = SW;
    for (var i = 0; i < NP; i++) {
      var hx = carHome[i*2]    + (secretHome[i*2]   - carHome[i*2])   * morph;
      var hy = carHome[i*2+1]  + (secretHome[i*2+1] - carHome[i*2+1]) * morph;
      hx *= sx; hy *= sy;
      var x = ppos[i*2], y = ppos[i*2+1];
      var stiff = 5.4 + pseed[i]*4.2;
      pvx[i] += (hx - x) * stiff * dt;
      pvy[i] += (hy - y) * stiff * dt;
      var dx = x - cur.x, dy = y - cur.y;
      var d2 = dx*dx + dy*dy + 0.02;
      if (d2 < 0.80) {
        var f = (0.50/d2) * (1.0 + shock*2.8) * dt * 6.0;
        pvx[i] += dx*f; pvy[i] += dy*f;
      }
      var damp = Math.pow(0.90, k);
      pvx[i] *= damp; pvy[i] *= damp;
      ppos[i*2]   = x + pvx[i]*dt;
      ppos[i*2+1] = y + pvy[i]*dt;
    }

    gl.clearColor(0.006, 0.006, 0.007, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(PROG);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, ppos);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, seedBuf);
    gl.enableVertexAttribArray(aSeed);
    gl.vertexAttribPointer(aSeed, 1, gl.FLOAT, false, 0, 0);
    gl.uniform2f(U.u_res, W, H);
    gl.uniform1f(U.u_size, Math.max(1.6, (H/900)*3.0));
    gl.uniform1f(U.u_intro, intro);
    gl.drawArrays(gl.POINTS, 0, NP);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
